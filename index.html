<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarot Draw</title>
<meta name="description" content="Draw tarot cards from three complete public-domain decks (Egyptian, Rider-Waite-Smith and Sola Busca) with their original card art and upright and reversed meanings.">
<link rel="canonical" href="https://followorbounce.github.io/tarot/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tarot Draw">
<meta property="og:title" content="Tarot Draw">
<meta property="og:url" content="https://followorbounce.github.io/tarot/">
<meta property="og:description" content="Draw tarot cards from three complete public-domain decks (Egyptian, Rider-Waite-Smith and Sola Busca) with their original card art and upright and reversed meanings.">
<meta property="og:image" content="https://followorbounce.github.io/tarot/og/index.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Tarot Draw — Tarot Draw">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://followorbounce.github.io/tarot/og/index.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=Jost:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "bba4e16a7d9b4d9985eda0cda2624e60"}'></script>
</head>
<body>
  <main>
    <header class="masthead">
      <svg class="mark" viewBox="0 0 84 28" width="84" height="28" aria-hidden="true">
        <rect x="1" y="1" width="26" height="26" fill="#c81e1e" stroke="#14120f" stroke-width="2"/>
        <polygon points="43,1 57,27 29,27" fill="#dda100" stroke="#14120f" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="70" cy="14" r="13" fill="#1b4f9c" stroke="#14120f" stroke-width="2"/>
      </svg>
      <h1>Tarot Draw</h1>
      <nav class="site-nav">
        <a href="index.html" class="active">Draw</a>
        <a href="deck.html">Full Deck</a>
      </nav>
    </header>

    <div class="deck-picker" id="deck-picker"></div>

    <label class="reversed-toggle">
      <input type="checkbox" id="reversed-toggle" checked>
      <span>Allow reversed cards</span>
    </label>

    <div class="stage">
      <div class="card" id="card">
        <div class="card-inner">
          <div class="card-face card-back">
            <div class="back-mark"></div>
          </div>
          <div class="card-face card-front">
            <img class="card-image" id="card-image" alt="">
          </div>
        </div>
      </div>
    </div>

    <div class="caption">
      <div class="card-num" id="card-num"></div>
      <div class="card-name" id="card-name"></div>
      <div class="card-orientation" id="card-orientation"></div>
      <div class="card-meaning" id="card-meaning"></div>
    </div>

    <button id="draw-btn">Draw a card</button>
  </main>

  <script src="cards-egyptian.js"></script>
  <script src="cards-rws.js"></script>
  <script src="cards-solabusca.js"></script>
  <script src="decks.js"></script>
  <script src="script.js"></script>
</body>
</html>
